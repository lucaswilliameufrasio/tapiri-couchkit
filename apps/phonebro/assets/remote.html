<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>PhoneBro Remote</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--surface:#151d38;--surface2:#1e2848;--line:#2d3a6b;--acc:#5cc8ff;--on-acc:#04121f;--tx:#eaf0ff;--mut:#9fb0e0;--warn:#ffd54a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:560px;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:12px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;gap:10px;min-height:44px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
.dot.ok{background:#4ade80}
#title{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
label{font-size:13px;color:var(--mut);display:block;margin:0 0 4px 2px}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;min-height:48px;background:var(--surface);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;font:inherit}
input::placeholder{color:#7283b5}
button{min-height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--tx);
  border:1px solid var(--line);border-radius:var(--r);padding:0 14px;font:inherit;font-size:15px;cursor:pointer;transition:transform .12s,background .12s,color .12s}
button:active{transform:scale(.96);background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
button.primary{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:600}
:is(button,input,a):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
#pad{height:min(44vh,360px);min-height:220px;background:radial-gradient(120% 120% at 20% 0%,#24336a,#0f1730);border:1px solid var(--line);border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);touch-action:none;text-align:center;padding:16px;user-select:none;-webkit-user-select:none}
#pad b{color:var(--tx);font-size:17px}
#pad small{font-size:13px;line-height:1.5}
#pad.live{border-color:var(--acc)}
section{display:flex;flex-direction:column;gap:8px}
h2{margin:6px 2px 0;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
#favs{display:flex;flex-wrap:wrap;gap:8px}
#favs button{font-size:14px;min-height:44px}
#favs:empty::before{content:"Nenhum favorito ainda";color:var(--mut);font-size:14px;padding:4px 2px}
.hint{font-size:13px;color:var(--mut);margin:0 2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
<symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
<symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></symbol>
<symbol id="i-rew" viewBox="0 0 24 24"><path d="M11 19l-8-7 8-7zM21 19l-8-7 8-7z"/></symbol>
<symbol id="i-ff" viewBox="0 0 24 24"><path d="M13 5l8 7-8 7zM3 5l8 7-8 7z"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM16 9l5 6M21 9l-5 6"/></symbol>
<symbol id="i-volm" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM16 12h5"/></symbol>
<symbol id="i-volp" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM16 12h5M18.5 9.5v5"/></symbol>
<symbol id="i-zm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11h6"/></symbol>
<symbol id="i-zp" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11h6M11 8v6"/></symbol>
<symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="i-desk" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
<symbol id="i-qr" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></symbol>
<symbol id="i-enter" viewBox="0 0 24 24"><path d="M20 5v7a3 3 0 0 1-3 3H5M9 11l-4 4 4 4"/></symbol>
<symbol id="i-go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</defs></svg>

<header><span class="dot" id="dot" aria-hidden="true"></span><div id="title" role="status">Conectando…</div></header>

<form id="go"><label for="url">Endereço ou busca</label>
<div class="field"><input id="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ex.: youtube.com"><button class="primary" aria-label="Ir"><svg><use href="#i-go"/></svg></button></div></form>

<div class="row">
<button data-a="back" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
<button data-a="forward" aria-label="Avançar"><svg><use href="#i-fwd"/></svg></button>
<button data-a="reload" aria-label="Recarregar"><svg><use href="#i-reload"/></svg></button>
<button data-a="home" aria-label="Página inicial"><svg><use href="#i-home"/></svg></button>
</div>

<div id="pad" role="application" aria-label="Touchpad"><b>Touchpad</b><small>1 dedo move o cursor · toque para clicar<br>2 dedos rolam a página · toque com 2 dedos volta</small></div>

<form id="tx"><label for="txt">Digitar no campo selecionado na TV</label>
<div class="field"><input id="txt" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Toque num campo na TV e digite aqui"><button type="button" id="enter" aria-label="Enter"><svg><use href="#i-enter"/></svg></button></div></form>

<section><h2>Mídia</h2>
<div class="row">
<button data-a="media" data-q="a=seek&v=-10" aria-label="Voltar 10 segundos"><svg><use href="#i-rew"/></svg></button>
<button data-a="media" data-q="a=toggle" class="primary" aria-label="Play ou pausa"><svg style="fill:currentColor"><use href="#i-play"/></svg></button>
<button data-a="media" data-q="a=seek&v=10" aria-label="Avançar 10 segundos"><svg><use href="#i-ff"/></svg></button>
<button data-a="key" data-q="code=34" aria-label="Tela cheia"><svg><use href="#i-full"/></svg></button>
</div>
<div class="row">
<button data-a="vol" data-q="d=-1" aria-label="Diminuir volume"><svg><use href="#i-volm"/></svg></button>
<button data-a="media" data-q="a=mute" aria-label="Silenciar vídeo"><svg><use href="#i-mute"/></svg></button>
<button data-a="vol" data-q="d=1" aria-label="Aumentar volume"><svg><use href="#i-volp"/></svg></button>
</div></section>

<section><h2>Página</h2>
<div class="row">
<button data-a="zoom" data-q="f=0.8" aria-label="Diminuir zoom"><svg><use href="#i-zm"/></svg></button>
<button data-a="zoom" data-q="f=1.25" aria-label="Aumentar zoom"><svg><use href="#i-zp"/></svg></button>
<button data-a="ua" id="ua" aria-label="Alternar desktop e mobile"><svg><use href="#i-desk"/></svg><span id="uat">Desktop</span></button>
</div>
<div class="row">
<button data-a="fav"><svg><use href="#i-star"/></svg>Favoritar</button>
<button data-a="qr"><svg><use href="#i-qr"/></svg>QR na TV</button>
</div></section>

<section><h2>Favoritos</h2><div id="favs"></div><p class="hint">Segure um favorito para remover.</p></section>

<script>
const $=s=>document.querySelector(s);
const K=new URLSearchParams(location.search).get('k')||sessionStorage.k||'';sessionStorage.k=K;
const buzz=()=>navigator.vibrate&&navigator.vibrate(8);
const api=(c,q={})=>{q.k=K;return fetch('/api/'+c+'?'+new URLSearchParams(q),{method:'POST'}).then(r=>r.json()).catch(()=>null)};
document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
  api(b.dataset.a,Object.fromEntries(new URLSearchParams(b.dataset.q||''))).then(()=>setTimeout(state,400));buzz()});
$('#go').onsubmit=e=>{e.preventDefault();api('nav',{url:$('#url').value});$('#url').blur();setTimeout(state,800)};
$('#txt').oninput=e=>api('text',{t:e.target.value});
$('#tx').onsubmit=e=>{e.preventDefault();api('key',{code:66})};
$('#enter').onclick=()=>{api('key',{code:66});buzz()};
async function state(){
  const s=await api('state');$('#dot').classList.toggle('ok',!!(s&&s.url));
  if(!s||!s.url){$('#title').textContent='Sem conexão com a TV';return}
  $('#title').textContent=s.url.startsWith('http://127.0.0.1')?'Página inicial':(s.title||s.url);
  if(document.activeElement!==$('#url'))$('#url').value=s.url.startsWith('http://127.0.0.1')?'':s.url;
  $('#uat').textContent=s.desktop?'Desktop':'Mobile';
  const f=$('#favs');f.textContent='';
  (s.bookmarks||'').split('\n').forEach(l=>{const p=l.split('\t');if(p.length<2)return;
    const b=document.createElement('button');b.textContent=p[0];b.onclick=()=>{api('nav',{url:p[1]});setTimeout(state,800)};
    let t,long=false;
    b.ontouchstart=()=>{long=false;t=setTimeout(()=>{long=true;if(confirm('Remover "'+p[0]+'"?')){api('unfav',{url:p[1]});setTimeout(state,400)}},700)};
    b.ontouchend=b.ontouchmove=()=>clearTimeout(t);
    b.addEventListener('click',e=>{if(long){e.stopImmediatePropagation();long=false}},true);
    f.appendChild(b)});
}
state();setInterval(state,5000);
// touchpad
const pad=$('#pad');let last=null,t0=0,moved=0,ax=0,ay=0,sy=0,maxT=0;
const pt=e=>{let x=0,y=0;for(const t of e.touches){x+=t.clientX;y+=t.clientY}return{x:x/e.touches.length,y:y/e.touches.length}};
pad.addEventListener('touchstart',e=>{e.preventDefault();pad.classList.add('live');
  if(e.touches.length==1){t0=Date.now();moved=0;maxT=1}else maxT=Math.max(maxT,e.touches.length);last=pt(e)},{passive:false});
pad.addEventListener('touchmove',e=>{e.preventDefault();const p=pt(e),dx=p.x-last.x,dy=p.y-last.y;last=p;moved+=Math.abs(dx)+Math.abs(dy);
  if(e.touches.length>=2)sy+=-dy*3;else{ax+=dx*2.2;ay+=dy*2.2}},{passive:false});
pad.addEventListener('touchend',e=>{e.preventDefault();
  if(e.touches.length==0){pad.classList.remove('live');if(moved<10&&Date.now()-t0<300){maxT>=2?api('back'):api('click');buzz()}maxT=0}},{passive:false});
setInterval(()=>{
  if(Math.abs(ax)>=1||Math.abs(ay)>=1){api('move',{dx:Math.round(ax),dy:Math.round(ay)});ax=ay=0}
  if(Math.abs(sy)>=2){api('scroll',{dy:Math.round(sy)});sy=0}
},40);
</script></body></html>
